# Fixed project name, so container names are predictable (evalrag-backend-1,
# ...) whichever directory Compose is run from.
name: evalrag

# Variables in ${...} below are interpolated from the shell or from --env-file,
# NOT from ../.env automatically (Compose looks for .env next to this file).
# Run every command from the project root as:
#   docker compose --env-file .env -f infra/docker-compose.yml <command>
#
# Every published port is bound to 127.0.0.1: these are development services
# with development credentials, and nothing here should be reachable from the
# network. Put a reverse proxy in front if you need that.

services:
  qdrant:
    # Pinned deliberately: a Qdrant storage volume cannot be read by an older
    # server, so downgrading this tag panics on startup against existing data.
    image: qdrant/qdrant:v1.19.1
    environment:
      # Optional. Qdrant treats an empty key as unset, so leaving QDRANT_API_KEY
      # blank keeps auth off. When you set it, the backend must send the same
      # key (it reads QDRANT_API_KEY from ../.env via env_file).
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: evalrag
      # No built-in default: set POSTGRES_PASSWORD in .env and pass --env-file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env and run compose with --env-file .env}
      POSTGRES_DB: evalrag
    ports: ["127.0.0.1:5434:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Gives Langfuse its own database instead of sharing the app's.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalrag -d evalrag"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    profiles: ["tracing"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Its own database, so Langfuse migrations cannot collide with ours.
      DATABASE_URL: postgresql://evalrag:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      # No guessable defaults. These cannot use ${VAR:?}: Compose interpolates
      # every service, including ones whose profile is inactive, so a required
      # variable here would break a plain `up` without tracing. Langfuse itself
      # refuses to start when they are empty. Generate each with:
      #   python -c "import secrets; print(secrets.token_urlsafe(32))"
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      NEXTAUTH_URL: http://localhost:3100
      SALT: ${LANGFUSE_SALT:-}
    ports: ["127.0.0.1:3100:3000"]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: dev
      network: host
    env_file:
      # Optional so `compose config` and CI work without a .env; the backend
      # still starts and reports what is missing.
      - path: ../.env
        required: false
    environment:
      # Container-internal URLs (override anything env_file might set):
      # services talk to each other via Compose DNS, not localhost.
      QDRANT_URL: http://qdrant:6333
      POSTGRES_URL: postgresql+psycopg://evalrag:${POSTGRES_PASSWORD}@postgres:5432/evalrag
      LANGFUSE_HOST: http://langfuse:3000
      # Inside the container, "localhost" is the container; host-gateway reaches the laptop.
      OLLAMA_HOST: http://host.docker.internal:11434
      # Absolute paths: the graph used to be written to a container path that
      # was not the bind mount, so it vanished on every rebuild.
      GRAPH_DATA_DIR: /data/graph
      LOG_DIR: /app/logs
      # Offline mode is opt-in. With the default (0) the embedding model and the
      # cross-encoder download into the bind-mounted cache below on first use.
      # Once they are there (or after `python scripts/download_models.py
      # --cache-dir .hf_cache`), set both to 1 in .env to skip HF's online
      # "check for updates" call, which intermittently dies with
      # closed-httpx-client. Setting them before the cache is filled makes the
      # embedder fail to load and the reranker silently fall back to BM25.
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-0}
      LOG_LEVEL: INFO
      # Everything else (API keys, GENERATOR_PROVIDER, REQUIRE_API_KEY, ADMIN_KEY,
      # OLLAMA_MODEL, WANDB_*, LANGFUSE_*) comes from env_file (../.env). Don't list
      # them here- `environment:` overrides env_file, so empty `${VAR:-}` defaults
      # would silently zero out values supplied in .env.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../backend/app:/app/app
      # Without this the image's baked-in copy of the tests is what
      # `compose exec backend pytest` runs, so edited tests appear to fail (or
      # pass) for reasons that have nothing to do with the current code.
      - ../backend/tests:/app/tests
      - ../scripts:/scripts
      - ../data:/data
      - ./logs:/app/logs
      # Bind-mounted from the host so downloaded models survive a rebuild, and so
      # they can be pre-downloaded outside the container (scripts/download_models.py)
      # - works around Docker Desktop DNS hiccups.
      - ../.hf_cache:/root/.cache/huggingface
    ports: ["127.0.0.1:8011:8000"]
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      VITE_BACKEND_URL: http://backend:8000
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/index.html:/app/index.html
      - ../frontend/vite.config.ts:/app/vite.config.ts
      - ../frontend/tsconfig.json:/app/tsconfig.json
      - ../frontend/tailwind.config.js:/app/tailwind.config.js
      - ../frontend/postcss.config.js:/app/postcss.config.js
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      - backend

volumes:
  qdrant_data:
  pg_data:
