[project]
name = "evalrag"
version = "0.3.0"
description = "Compare and evaluate RAG retrieval strategies with Claude"
requires-python = ">=3.11"
dependencies = [
    # Web layer
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "python-multipart>=0.0.9,<1.0",
    # LLM provider
    "anthropic>=0.39,<2.0",
    # Retrieval
    "qdrant-client>=1.16,<2.0",  # collection metadata (embedding model check)
    "sentence-transformers>=3.0,<6.0",
    "rank-bm25>=0.2.2,<1.0",
    "pypdf>=4.3,<7.0",
    # Document formats and OCR (tesseract/poppler binaries come from the OS)
    "python-docx>=1.1,<2.0",
    "python-pptx>=1.0,<2.0",
    "odfpy>=1.4,<2.0",
    "pytesseract>=0.3.10,<1.0",
    "pdf2image>=1.17,<2.0",
    # Prompts
    "jinja2>=3.1,<4.0",
    # API keys and usage accounting
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    # Monitoring: /metrics and the Langfuse OTLP exporter (docs/monitoring.md)
    "prometheus-client>=0.20,<1.0",
    "httpx>=0.27,<1.0",
    # SSO: OIDC token validation (RS/PS/ES signatures need `crypto`)
    "PyJWT[crypto]>=2.8,<3.0",
]

[project.optional-dependencies]
# OpenAI is an optional generator provider; imported lazily.
openai = ["openai>=1.50,<3.0"]
# Optional eval dashboards. Langfuse needs no SDK: traces go to its OTLP
# endpoint over httpx (app/tracing/langfuse_exporter.py).
tracing = ["wandb>=0.18,<1.0"]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # FastAPI's Depends()/Query() defaults are the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]  # nested `with patch(...)` reads better than one long chain

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# The codebase is not fully annotated yet; these stay off until it is.
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::UserWarning:qdrant_client.*",
    "ignore::UserWarning:sklearn.*",
]
