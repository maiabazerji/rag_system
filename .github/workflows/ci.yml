name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job here writes to the repository or the registry.
permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the default wheel pulls ~2GB of CUDA runtime.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests ../scripts

      - name: Type check
        run: mypy app

      - name: Type check scripts
        # The scripts import `app`, so run from backend/ with it on the path.
        run: MYPYPATH=. mypy ../scripts

      - name: Import the app without any configuration
        # Configuration is validated in the lifespan, not at import. If that
        # regresses, every one of these tools breaks at once.
        run: python -c "import app.main"

      - name: Tests
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Dependency audit
        # Reports known vulnerabilities in the installed environment. Not a gate
        # yet: torch and friends ship advisories faster than they can be bumped.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --skip-editable

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check (including tests)
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/docker-compose.yml config > /dev/null
          docker compose --env-file .env -f infra/docker-compose.yml --profile tracing config > /dev/null

  docker:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend (runtime target)
        run: docker build --target runtime -t evalrag-backend:ci backend

      - name: Build backend (dev target)
        run: docker build --target dev -t evalrag-backend-dev:ci backend

      - name: Build frontend
        run: docker build -t evalrag-frontend:ci frontend
